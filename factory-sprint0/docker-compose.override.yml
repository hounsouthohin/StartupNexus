# docker-compose.override.yml — profil DEV uniquement
# Chargé automatiquement par docker-compose en local.
# NE PAS committer en prod (ajouter à .gitignore si nécessaire).
#
# Bind-mounts granulaires : seul le code source Python/config est monté.
# Les artefacts runtime (generated-projects, logs, venv) restent dans des volumes Docker.

services:
  factory-worker:
    # Port PREVIEW (Scène-B, 25 Juil) : l'app générée tourne DANS le worker (app +
    # node_modules déjà présents) ; ce port l'expose à l'hôte pour que l'opérateur
    # ouvre http://localhost:3100. Nécessite `docker compose up -d factory-worker` une fois.
    ports:
      - "3100:3100"
    environment:
      # Scène-B : à chaque build réussi, l'app est stationnée et l'URL renvoyée dans le rapport.
      - PREVIEW_ENABLED=1
      # Id Clerk dont les données seront visibles (mets TON id ; user_demo = juste pour tester).
      - SEED_USER_ID=${SEED_USER_ID:-user_demo}
      # Bootstrap admin (type K) : l'email de ce compte obtient le rôle privilégié dès la
      # connexion (sans réglage Clerk), pour que la démo montre la vue « chef ».
      - PREVIEW_ADMIN_EMAIL=${PREVIEW_ADMIN_EMAIL:-bambarathohin@gmail.com}
      # Clés Clerk de DEV (à placer dans .env, jamais commité) — sans elles, le serveur
      # démarre mais l'auth renvoie 500. NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY / CLERK_SECRET_KEY.
    volumes:
      - ./agents:/app/agents
      - ./workflows:/app/workflows
      - ./config:/app/config
      - ./schemas:/app/schemas
      - ./scripts:/app/scripts
      - ./run:/app/run
      - ./api:/app/api
      - ./prompts:/app/prompts
      - ./semgrep:/app/semgrep
      - ./quality_checker:/app/quality_checker
      - ./assets:/app/assets
      # utils/ manquait (constaté 19 Juil) : run_report.py y vit, donc toute modification
      # du FactoryRunReport restait invisible — le conteneur gardait la version de l'image.
      - ./utils:/app/utils
      - ./init_qdrant.py:/app/init_qdrant.py
      - ../sorties.md:/sorties.md
