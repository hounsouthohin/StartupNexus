services:
  # Elasticsearch désactivé — ENABLE_ES=false côté Temporal, 935 MB pour rien.
  # Réactiver si besoin de la recherche avancée dans l'UI Temporal.

  # --------------------------------------------------------------------------------
  # POSTGRESQL – base principale
  # --------------------------------------------------------------------------------
  postgresql:
    container_name: temporal-postgresql
    image: postgres:17.7
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------------
  # TEMPORAL SERVER – officiel + Elasticsearch activé
  # --------------------------------------------------------------------------------
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.29.1
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - POSTGRESQL_SEEDS=temporal-postgresql
      - ENABLE_ES=false
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v8
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - temporal-network
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --------------------------------------------------------------------------------
  # TEMPORAL UI – la plus belle interface du monde
  # --------------------------------------------------------------------------------
  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.38.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGIN=*
    ports:
      - "8080:8080"
    networks:
      - temporal-network
    depends_on:
      temporal:
        condition: service_healthy

  # --------------------------------------------------------------------------------
  # Factory Worker - notre application Python
  # --------------------------------------------------------------------------------
  factory-worker:
    container_name: factory-worker
    build: .
    env_file:
      - .env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - MERMAID_TMP_DIR=/tmp/mermaid
      - FACTORY_WORKDIR=/app/generated-projects
      - SEMGREP_RULES_PATH=/app/semgrep/rules/critical.yml
      - SEMGREP_TIMEOUT=30
    command: bash /app/scripts/start.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - ./logs:/app/logs
      - generated-projects:/app/generated-projects
      - factory-shadow-log:/app/logs/shadow
    networks:
      - temporal-network
    depends_on:
      temporal:
        condition: service_healthy

# Volumes persistants
volumes:
  postgresql-data:
  elasticsearch-data:
  generated-projects:
  factory-shadow-log:

# Réseau
networks:
  temporal-network:
    driver: bridge
