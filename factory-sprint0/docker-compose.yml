version: '3.8'

services:
  # --------------------------------------------------------------------------------
  # 1. Base de Données (PostgreSQL)
  # --------------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # Le port est exposé sur le réseau interne (le service Temporal s'y connecte)
    # Suppression de "5432:5432" pour des raisons de sécurité, car seul Temporal en a besoin.
    # Si vous devez vous y connecter depuis l'extérieur, décommentez la ligne ports:
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    # Healthcheck : essentiel pour s'assurer que Temporal ne démarre que quand Postgres est prêt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10 # Augmenté à 10 tentatives pour plus de robustesse au démarrage

  # --------------------------------------------------------------------------------
  # 2. Serveur Temporal
  # --------------------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.21.0
    container_name: temporal-server
    restart: unless-stopped
    ports:
      - "7233:7233" # Port gRPC (pour les Workers et l'UI)
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_SEEDS=postgres
    networks:
      - app-network
    # DÉPENDANCE : Attend que la base de données soit saine et prête
    depends_on:
      postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------------
  # 3. Temporal Web UI
  # --------------------------------------------------------------------------------
  temporal-web:
    image: temporalio/web:latest
    container_name: temporal-web-ui
    restart: unless-stopped
    ports:
      - "8080:8088"
    environment:
      # ANCIEN (ne marche plus avec les versions récentes)
      # - TEMPORAL_GRPC_ENDPOINT=temporal:7233
      # NOUVEAU (obligatoire depuis mi-2024)
      - TEMPORAL_ADDRESS=temporal:7233
      # Option bonus pour éviter les warnings CORS plus tard
      - TEMPORAL_CORS_ORIGIN=*
    networks:
      - app-network
    depends_on:
      - temporal

  # --------------------------------------------------------------------------------
  # 4. n8n (Outil d'automatisation)
  # --------------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n
    container_name: n8n-server
    restart: unless-stopped
    ports:
      - "5678:5678" # UI accessible sur http://localhost:5678
    environment:
      # Configurations de base
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}

      # 🌟 CORRECTIONS / AMÉLIORATIONS pour éviter les warnings et améliorer la sécurité 🌟
      - DB_SQLITE_POOL_SIZE=1 # Correction du warning SQLite (même si vous utilisez Postgres, l'image n8n peut le demander)
      - N8N_RUNNERS_ENABLED=true # Active les Task Runners, recommandé pour l'avenir
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true # 🔐 SÉCURITÉ : Bloque l'accès aux variables Env dans les Code Nodes par défaut (Recommandé)
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true # 🔐 SÉCURITÉ : Corrige le warning de permissions sur le fichier de config n8n

    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-network
    # Ajout d'une dépendance optionnelle si n8n doit interagir avec Temporal au démarrage
    # depends_on:
    #   - temporal 

  # --------------------------------------------------------------------------------
  # 5. Qdrant (Base de Données Vectorielle)
  # --------------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    restart: unless-stopped
    ports:
      - "6333:6333" # Port HTTP/REST (API) accessible sur http://localhost:6333
      # - "6334:6334" # Port gRPC (gardé en commentaire si non utilisé)
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network

# Définition des volumes nommés pour la persistance des données
volumes:
  postgres_data:
  n8n_data:
  qdrant_data:

# Définition d'un réseau interne pour que les conteneurs puissent communiquer entre eux par leur nom de service
networks:
  app-network:
    driver: bridge