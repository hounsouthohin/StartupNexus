services:
  # Elasticsearch désactivé — ENABLE_ES=false côté Temporal, 935 MB pour rien.
  # Réactiver si besoin de la recherche avancée dans l'UI Temporal.

  # --------------------------------------------------------------------------------
  # POSTGRESQL – base principale
  # --------------------------------------------------------------------------------
  postgresql:
    container_name: temporal-postgresql
    image: postgres:17.7
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------------
  # TEMPORAL SERVER – officiel + Elasticsearch activé
  # --------------------------------------------------------------------------------
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.29.1
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - POSTGRESQL_SEEDS=temporal-postgresql
      - ENABLE_ES=false
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v8
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - temporal-network
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --------------------------------------------------------------------------------
  # TEMPORAL UI – la plus belle interface du monde
  # --------------------------------------------------------------------------------
  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.38.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGIN=*
    ports:
      - "8080:8080"
    networks:
      - temporal-network
    depends_on:
      temporal:
        condition: service_healthy

  # --------------------------------------------------------------------------------
  # n8n – notre interface humaine (le bouton "Démarrer")
  # --------------------------------------------------------------------------------
  n8n:
    container_name: n8n
    image: n8nio/n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=Admin123!
      - N8N_HOST=localhost
      - N8N_PORT=5678
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # Qdrant – notre base vectorielle RAG
  # --------------------------------------------------------------------------------
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "grep -qE ':[0]*18BD .* 0A ' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --------------------------------------------------------------------------------
  # Factory Worker - notre application Python
  # --------------------------------------------------------------------------------
  factory-worker:
    container_name: factory-worker
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - QDRANT_URL=http://qdrant:6333
      - MERMAID_TMP_DIR=/tmp/mermaid
      - FACTORY_WORKDIR=/app/generated-projects
      - SEMGREP_RULES_PATH=/app/semgrep/rules/critical.yml
      - SEMGREP_TIMEOUT=30
      # Interrupteur A/B mesure RAG (Sprint 5) : DISABLE_RAG=1 dans le shell hôte avant
      # `docker compose up -d factory-worker` désactive l'injection Qdrant. Vide = RAG actif.
      - DISABLE_RAG=${DISABLE_RAG:-}
    command: bash /app/scripts/start.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - ./logs:/app/logs
      - generated-projects:/app/generated-projects
      - factory-shadow-log:/app/logs/shadow
    networks:
      - temporal-network
    depends_on:
      qdrant:
        condition: service_healthy
      temporal:
        condition: service_healthy

# Volumes persistants
volumes:
  postgresql-data:
  elasticsearch-data:
  n8n_data:
  qdrant_data:
  generated-projects:
  factory-shadow-log:

# Réseau
networks:
  temporal-network:
    driver: bridge
