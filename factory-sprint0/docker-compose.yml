services:
  # --------------------------------------------------------------------------------
  # ELASTICSEARCH – pour la visibilité avancée dans l'UI Temporal
  # --------------------------------------------------------------------------------
  elasticsearch:
    container_name: temporal-es
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # POSTGRESQL – base principale
  # --------------------------------------------------------------------------------
  postgresql:
    container_name: temporal-postgresql
    image: postgres:${POSTGRESQL_VERSION}
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # TEMPORAL SERVER – officiel + Elasticsearch activé
  # --------------------------------------------------------------------------------
  temporal:
    container_name: temporal
    depends_on:
      - postgresql
      - elasticsearch
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      #Postgres_seeds : nom du service de Base de donné que temporal utilise pour se connecter
      - POSTGRES_SEEDS=temporal-postgresql
      - POSTGRESQL_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v8
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # TEMPORAL UI – la plus belle interface du monde
  # --------------------------------------------------------------------------------
  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGIN=*
    ports:
      - "8080:8080"
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # n8n – notre interface humaine (le bouton "Démarrer")
  # --------------------------------------------------------------------------------
  n8n:
    container_name: n8n
    image: n8nio/n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=Admin123!
      - N8N_HOST=localhost
      - N8N_PORT=5678
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # Qdrant – notre base vectorielle RAG
  # --------------------------------------------------------------------------------
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # Ollama - pour le fallback LLM local
  # --------------------------------------------------------------------------------
  ollama:
    container_name: ollama
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # Factory Worker - notre application Python
  # --------------------------------------------------------------------------------
  factory-worker:
    container_name: factory-worker
    build: .
    env_file:
      - .env
    command: >
      bash -c "python scripts/wait-for-it.py temporal:7233 30 && python run/worker.py"
    volumes:
      - .:/app
    networks:
      - temporal-network
    depends_on:
      - temporal
      - qdrant
      - ollama

# Volumes persistants
volumes:
  postgresql-data:
  elasticsearch-data:
  n8n_data:
  qdrant_data:
  ollama_data:

# Réseau
networks:
  temporal-network:
    driver: bridge
