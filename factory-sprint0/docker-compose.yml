services:
  # --------------------------------------------------------------------------------
  # ELASTICSEARCH – pour la visibilité avancée dans l'UI Temporal
  # --------------------------------------------------------------------------------
  elasticsearch:
    container_name: temporal-es
    image: elasticsearch:9.2.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --------------------------------------------------------------------------------
  # POSTGRESQL – base principale
  # --------------------------------------------------------------------------------
  postgresql:
    container_name: temporal-postgresql
    image: postgres:17.7
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # TEMPORAL SERVER – officiel + Elasticsearch activé
  # --------------------------------------------------------------------------------
  temporal:
    container_name: temporal
    depends_on:
      postgresql:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    image: temporalio/auto-setup:1.29.1
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      #Postgres_seeds : nom du service de Base de donné que temporal utilise pour se connecter
      - POSTGRES_SEEDS=temporal-postgresql
      - POSTGRESQL_SEEDS=temporal-postgresql
      - ENABLE_ES=false
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v8
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # TEMPORAL UI – la plus belle interface du monde
  # --------------------------------------------------------------------------------
  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    image: temporalio/ui:2.38.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGIN=*
    ports:
      - "8080:8080"
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # n8n – notre interface humaine (le bouton "Démarrer")
  # --------------------------------------------------------------------------------
  n8n:
    container_name: n8n
    image: n8nio/n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=Admin123!
      - N8N_HOST=localhost
      - N8N_PORT=5678
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - temporal-network

  # --------------------------------------------------------------------------------
  # Qdrant – notre base vectorielle RAG
  # --------------------------------------------------------------------------------
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - temporal-network



  # --------------------------------------------------------------------------------
  # Factory Worker - notre application Python
  # --------------------------------------------------------------------------------
  factory-worker:
    container_name: factory-worker
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    command: >
      bash -c "python scripts/wait-for-it.py qdrant:6333 90 && python init_qdrant.py && python scripts/wait-for-it.py temporal:7233 90 && python run/worker.py"
    volumes:

      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    networks:
      - temporal-network
    depends_on:
      temporal:
        condition: service_started


# Volumes persistants
volumes:
  postgresql-data:
  elasticsearch-data:
  n8n_data:
  qdrant_data:


# Réseau
networks:
  temporal-network:
    driver: bridge
