# Configuration LangGraph - Sprint 0.5
# Permet le switch fusion/split sans refactoring majeur du code métier

version: "1.0.0"

# Mode de déploiement actif
deployment_mode:
  current: "fusion"                     # fusion | split
  last_changed: "2026-02-07"
  reason: "Sprint 0.5-3 : validation empirique architecture + rapidité de livraison"

# ────────────────────────────────────────────────
# Mode Fusion (actif Sprints 0.5 → 3)
# ────────────────────────────────────────────────
fusion_config:
  enabled: true
  
  agents:
    dev_test_agent:
      class: "agents.dev_test_agent.DevTestAgent"
      responsibilities:
        - dev
        - test
      contracts:
        dev:
          input:  "schemas/contracts/dev_agent_contract.json"
          output: "schemas/contracts/dev_agent_contract.json"
        test:
          input:  "schemas/contracts/test_agent_contract.json"
          output: "schemas/contracts/test_agent_contract.json"
      workflow_order:
        - dev           # Génère code + structure fichiers
        - test          # Génère tests sur base des fichiers
      error_handling: "isolated"   # échec tests n'arrête pas le code dev

  # Métriques pour préparer la décision de split (gate Sprint 4)
  metrics:
    complexity:
      measure: true
      threshold_percent: 20       # > 20% orchestration/communication → split pertinent
    overhead:
      measure: true
      baseline: "first_3_projects"
    agent_count:
      threshold: 8                # > 8 agents micro → on bascule probablement

# ────────────────────────────────────────────────
# Mode Split (préparé pour Sprint 4+)
# ────────────────────────────────────────────────
split_config:
  enabled: false
  activation_trigger: "gate_sprint_4"
  
  agents:
    dev_agent:
      class: "agents.dev.dev_agent"
      contract: "schemas/contracts/dev_agent_contract.json"
      
    test_agent:
      class: "agents.test_coverage.test_coverage_agent"
      contract: "schemas/contracts/test_agent_contract.json"
  
  workflow:
    sequence:
      - agent: "dev_agent"
        timeout: 1800
      - agent: "test_agent"
        timeout: 900
        depends_on: "dev_agent.success"

# ────────────────────────────────────────────────
# Router LangGraph (décision centrale)
# ────────────────────────────────────────────────
router:
  type: "conditional"
  decision_logic: "config.deployment_mode.current == 'fusion'"
  
  routes:
    fusion:
      node: "dev_test_agent"
      config: "fusion_config"
    
    split:
      nodes:
        - "dev_agent"
        - "test_agent"
      config: "split_config"

# Validation & robustesse
validation:
  contracts_check: true
  schema_validation: true
  health_checks_required: true

# Logging + métriques
monitoring:
  log_level: "INFO"
  metrics_collection: true
  export_format: "json"
  export_path: "logs/metrics/"