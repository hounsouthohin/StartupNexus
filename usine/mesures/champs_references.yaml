      alias: [session]
      attendus:
        - { alias: [date], types: [date, date_heure] }
      acceptables: [date, intitule, titre, nom]
      interdits: [formateur, salle, stagiaire, entite, etat, statut]
    entite:
      alias: [entite]
      attendus: []
      acceptables: [nom]
      interdits: [stagiaire]
    stagiaire:
      alias: [stagiaire]
      attendus: []
      acceptables: [nom, prenom, telephone]
      interdits: [entite, session]
    formateur:
      alias: [formateur]
      attendus: []
      acceptables: [nom, prenom]
      interdits: [session]
    salle:
      alias: [salle]
      attendus: []
      acceptables: [nom]
      interdits: [session]
    facture:
      alias: [facture]
      attendus: []
      acceptables: [montant, numero, date]
      interdits: [entite, session]
    bilan:
      alias: [bilan]
      attendus: []
      acceptables: [contenu, texte, date]
      interdits: [entite, session]
    ecriture:
      alias: [ecriture]
      attendus: []
      acceptables: [montant, libelle, date]
      interdits: [facture]
    tache:
      alias: [tache]
